<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💬 Simple Chat App</h1>
        </div>

        <!-- Setup Section (দেখা যাবে শুরুতে) -->
        <div id="setupSection" class="setup-section">
            <h2>আপনার নাম বলুন</h2>
            <input type="text" id="nameInput" placeholder="আপনার নাম লিখুন..." />
            <button onclick="startChat()">শুরু করুন</button>
        </div>

        <!-- Chat Section (যখন চ্যাট শুরু হবে) -->
        <div id="chatSection" class="chat-section hidden">
            <!-- আপনার নাম দেখাবে -->
            <div class="user-info">
                <p>আপনি: <strong id="userName"></strong></p>
            </div>

            <!-- চ্যাট মেসেজ দেখা যাবে এখানে -->
            <div id="chatBox" class="chat-box">
                <!-- মেসেজ এখানে আসবে -->
            </div>

            <!-- মেসেজ লেখার জায়গা -->
            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="মেসেজ লিখুন..."
                    onkeypress="handleKeyPress(event)"
                />
                <button onclick="sendMessage()">পাঠান</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
